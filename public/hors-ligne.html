<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne — Portail client</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f6f4; color: #16181d; }
  @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #eef0f4; } .card { background: #16191f; border-color: #262b34; } p { color: #b3b9c6; } }
  .card { max-width: 420px; margin: 24px; padding: 32px; background: #fff; border: 1px solid #e3e2dd; border-radius: 14px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #4b5160; line-height: 1.6; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 9px; background: #4f46e5; color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>Pas de connexion</h1>
    <p>Cette page n'a pas encore été consultée sur cet appareil. Les pages déjà ouvertes restent lisibles hors ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
